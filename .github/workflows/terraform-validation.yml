name: Terraform validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-validation.yml"
  push:
    branches:
      - zayvi-aws-integration
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Create validation-only Lambda package placeholders
        run: |
          # terraform validate evaluates filebase64sha256() even though no
          # infrastructure is created. Deployment packaging is handled
          # separately; these empty files exist only so static validation can
          # evaluate the configuration in CI.
          : > zayvi-api-bootstrap.zip
          : > zayvi-db-bootstrap.zip

      - name: Initialise providers without a backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color
