name: Terraform validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
      - "database/migrations/**"
      - "lib/kredal-signature.cjs"
      - ".terraform-version"
      - ".github/workflows/terraform-validation.yml"
  push:
    branches:
      - zayvi-aws-integration
      - zayvi-admin-dashboard
    paths:
      - "infra/**"
      - "database/migrations/**"
      - "lib/kredal-signature.cjs"
      - ".terraform-version"
      - ".github/workflows/terraform-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test deployment tooling
        working-directory: .
        run: node --test infra/scripts/*.test.cjs

      - name: Build real Lambda archives
        working-directory: .
        run: |
          npm --prefix infra/lambda ci
          npm --prefix infra/lambda run package
          npm ci
          npm --prefix infra/lambda run package:merchant-registration
          npm --prefix infra/db-bootstrap ci
          npm --prefix infra/db-bootstrap run package

      - name: Initialise providers without a backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Test Preview invariants without AWS credentials
        run: terraform test -no-color
