name: Domain security tests

on:
  push:
    branches: [zayvi-aws-integration, zayvi-admin-dashboard]
  pull_request:
    branches: [main, zayvi-admin-dashboard]

jobs:
  security-domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:store-access
      - run: npm run test:storefront
