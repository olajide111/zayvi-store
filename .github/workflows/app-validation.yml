name: Application validation

on:
  push:
    branches:
      - zayvi-aws-integration
      - zayvi-admin-dashboard
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-app:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate AWS Lambda syntax
        run: node --check infra/lambda/index.js

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Package database bootstrap
        working-directory: infra/db-bootstrap
        run: |
          npm ci
          npm run package

      - name: Verify all database migrations are packaged
        run: |
          set -euo pipefail
          expected="$(find database/migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9]_*.sql' -printf '%f\n' | sort)"
          packaged="$(unzip -Z1 infra/terraform/zayvi-db-bootstrap.zip | awk -F/ '$1 == "migrations" && $2 ~ /^[0-9][0-9][0-9][0-9]_.+\.sql$/ { print $2 }' | sort)"

          if [ "$expected" != "$packaged" ]; then
            echo "Database bootstrap package is missing or contains unexpected migrations."
            echo "Expected:"
            printf '%s\n' "$expected"
            echo "Packaged:"
            printf '%s\n' "$packaged"
            exit 1
          fi

          echo "Verified packaged migrations:"
          printf '%s\n' "$packaged"
