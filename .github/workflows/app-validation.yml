name: Application validation

on:
  push:
    branches:
      - zayvi-aws-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-app:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate AWS Lambda syntax
        run: node --check infra/lambda/index.js

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
